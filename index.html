<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Flowing Heart & Particle Text On Top</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 18% 78%, rgba(145, 38, 105, 0.24) 0%, rgba(75, 18, 58, 0.08) 32%, transparent 60%),
        radial-gradient(circle at 84% 26%, rgba(135, 35, 100, 0.22) 0%, rgba(65, 18, 55, 0.07) 30%, transparent 58%),
        radial-gradient(circle at 92% 8%, rgba(70, 95, 155, 0.16) 0%, transparent 42%),
        radial-gradient(circle at 50% 50%, #09040d 0%, #040208 55%, #010103 100%);
      overflow: hidden;
      cursor: grab;
      user-select: none;
    }
    body:active {
      cursor: grabbing;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const PARTICLE_TEXT = "Bé gà bé bỏng đáng iu dễ thương";

    let width, height, cx, cy, baseScale;

    let bgStars = [];
    let bgBokeh = [];
    let bgNebulaClouds = [];

    const particles = [];
    let textParticles = [];
    let emitterT = 0;
    const emitterSpeed = 0.018;
    let isDrawingDone = false;

    function initBackgroundElements() {
      bgStars = [];
      bgBokeh = [];
      bgNebulaClouds = [];

      bgNebulaClouds = [
        { x: width * 0.16, y: height * 0.78, r: Math.max(width, height) * 0.26, color: "rgba(175, 50, 125, 0.11)" },
        { x: width * 0.24, y: height * 0.72, r: Math.max(width, height) * 0.18, color: "rgba(215, 75, 155, 0.08)" },
        { x: width * 0.84, y: height * 0.30, r: Math.max(width, height) * 0.25, color: "rgba(165, 45, 120, 0.11)" },
        { x: width * 0.78, y: height * 0.38, r: Math.max(width, height) * 0.17, color: "rgba(195, 65, 145, 0.07)" }
      ];

      const bokehCount = 26;
      for (let i = 0; i < bokehCount; i++) {
        let bx = Math.random() * width;
        let by = Math.random() * height;

        const distToCenter = Math.hypot(bx - width / 2, by - height / 2);
        const minClearRadius = Math.min(width, height) * 0.28;
        if (distToCenter < minClearRadius) {
          const ang = Math.atan2(by - height / 2, bx - width / 2);
          bx = width / 2 + Math.cos(ang) * (minClearRadius + Math.random() * 140);
          by = height / 2 + Math.sin(ang) * (minClearRadius + Math.random() * 140);
        }

        const isWarm = Math.random() > 0.45;
        bgBokeh.push({
          x: bx,
          y: by,
          radius: 8 + Math.random() * 24,
          alpha: 0.04 + Math.random() * 0.09,
          color: isWarm ? "245, 195, 220" : "210, 220, 240",
          driftX: (Math.random() - 0.5) * 0.08,
          driftY: (Math.random() - 0.5) * 0.08,
          pulsePhase: Math.random() * Math.PI * 2,
          pulseSpeed: 0.008 + Math.random() * 0.012
        });
      }

      const starCount = 190;
      for (let i = 0; i < starCount; i++) {
        bgStars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: 0.5 + Math.random() * 1.3,
          baseAlpha: 0.18 + Math.random() * 0.55,
          twinklePhase: Math.random() * Math.PI * 2,
          twinkleSpeed: 0.015 + Math.random() * 0.025,
          tint: Math.random() > 0.75 ? "255, 195, 230" : "225, 235, 255"
        });
      }
    }

    function drawBackground() {
      for (let i = 0; i < bgNebulaClouds.length; i++) {
        const c = bgNebulaClouds[i];
        const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
        grad.addColorStop(0, c.color);
        grad.addColorStop(0.55, "rgba(110, 25, 80, 0.04)");
        grad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = 0; i < bgStars.length; i++) {
        const s = bgStars[i];
        s.twinklePhase += s.twinkleSpeed;
        const alpha = s.baseAlpha * (0.65 + 0.35 * Math.sin(s.twinklePhase));
        ctx.fillStyle = `rgba(${s.tint}, ${alpha.toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = 0; i < bgBokeh.length; i++) {
        const b = bgBokeh[i];
        b.x += b.driftX;
        b.y += b.driftY;
        b.pulsePhase += b.pulseSpeed;

        if (b.x < -40) b.x = width + 40;
        if (b.x > width + 40) b.x = -40;
        if (b.y < -40) b.y = height + 40;
        if (b.y > height + 40) b.y = -40;

        const curAlpha = b.alpha * (0.75 + 0.25 * Math.sin(b.pulsePhase));
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius);
        grad.addColorStop(0, `rgba(${b.color}, ${curAlpha.toFixed(3)})`);
        grad.addColorStop(0.7, `rgba(${b.color}, ${(curAlpha * 0.55).toFixed(3)})`);
        grad.addColorStop(1, `rgba(${b.color}, 0)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    let rotX = 0;
    let rotY = 0;
    let velX = 0;
    let velY = 0;
    let zoom = 1;

    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    window.addEventListener("mousedown", (e) => {
      isDragging = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastMouseX;
      const dy = e.clientY - lastMouseY;

      velY = dx * 0.007;
      velX = -dy * 0.007;

      rotY += velY;
      rotX += velX;

      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    window.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        lastMouseX = e.touches[0].clientX;
        lastMouseY = e.touches[0].clientY;
      }
    });

    window.addEventListener("touchmove", (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - lastMouseX;
      const dy = e.touches[0].clientY - lastMouseY;

      velY = dx * 0.007;
      velX = -dy * 0.007;

      rotY += velY;
      rotX += velX;

      lastMouseX = e.touches[0].clientX;
      lastMouseY = e.touches[0].clientY;
    });

    window.addEventListener("touchend", () => {
      isDragging = false;
    });

    window.addEventListener("wheel", (e) => {
      zoom -= e.deltaY * 0.0008;
      zoom = Math.max(0.4, Math.min(2.5, zoom));
    });

    function project3D(x, y, z) {
      const cosX = Math.cos(rotX);
      const sinX = Math.sin(rotX);
      const y1 = y * cosX - z * sinX;
      const z1 = y * sinX + z * cosX;

      const cosY = Math.cos(rotY);
      const sinY = Math.sin(rotY);
      const x2 = x * cosY + z1 * sinY;
      const z2 = -x * sinY + z1 * cosY;

      const fov = 700;
      const scaleFactor = (fov / (fov + z2)) * zoom;

      return {
        x: cx + x2 * scaleFactor,
        y: cy + y1 * scaleFactor,
        scale: scaleFactor
      };
    }

    function getHeartPoint3D(t) {
      const angle = -t;
      const sinA = Math.sin(angle);
      const x = 16 * Math.pow(sinA, 3);
      let y = -(
        13 * Math.cos(angle) -
        5.4 * Math.cos(2 * angle) -
        2.2 * Math.cos(3 * angle) -
        1.1 * Math.cos(4 * angle)
      );

      if (Math.cos(angle) < 0) {
        y += Math.pow(-Math.cos(angle), 3) * 1.6;
      }

      return {
        x: x * baseScale,
        y: y * baseScale,
        z: 0
      };
    }

    function getTipPinchFactor(t) {
      const sideFactor = Math.abs(Math.sin(t));
      return 0.14 + 0.86 * Math.pow(sideFactor, 0.75);
    }

    class FlowingParticle3D {
      constructor(t) {
        this.t = t;
        this.flowSpeed = 0.006 + Math.random() * 0.008;

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const radius = Math.pow(Math.random(), 0.65) * 21;

        this.baseOffsetX = Math.sin(phi) * Math.cos(theta) * radius;
        this.baseOffsetY = Math.sin(phi) * Math.sin(theta) * radius;
        this.baseOffsetZ = Math.cos(phi) * radius * 1.4;

        this.wobblePhase = Math.random() * Math.PI * 2;
        this.wobbleSpeed = 0.03 + Math.random() * 0.03;

        this.size = 1.0 + Math.random() * 1.25;
        this.alpha = 0.78 + Math.random() * 0.22;

        const hue = 322 + Math.random() * 26;
        const sat = 75 + Math.random() * 25;
        const light = 55 + Math.random() * 28;
        this.color = `hsla(${hue}, ${sat}%, ${light}%, ${this.alpha.toFixed(3)})`;
      }

      update() {
        this.t += this.flowSpeed;
        this.wobblePhase += this.wobbleSpeed;

        const basePos = getHeartPoint3D(this.t);
        const pinch = getTipPinchFactor(this.t);
        const wobble = Math.sin(this.wobblePhase) * 2.2 * pinch;

        this.x = basePos.x + this.baseOffsetX * pinch + wobble;
        this.y = basePos.y + this.baseOffsetY * pinch + Math.cos(this.wobblePhase) * 2.2 * pinch;
        this.z = basePos.z + this.baseOffsetZ * pinch;
      }

      draw(ctx) {
        const proj = project3D(this.x, this.y, this.z);
        if (proj.scale <= 0) return;

        const drawSize = Math.max(0.6, this.size * proj.scale);
        ctx.fillStyle = this.color;
        ctx.fillRect(proj.x, proj.y, drawSize, drawSize);
      }
    }

    class TextParticle3D {
      constructor(homeX, homeY, homeZ) {
        this.homeX = homeX;
        this.homeY = homeY;
        this.homeZ = homeZ;

        this.x = homeX + (Math.random() - 0.5) * 16;
        this.y = homeY + (Math.random() - 0.5) * 16;
        this.z = homeZ + (Math.random() - 0.5) * 16;

        this.shimmerPhase = Math.random() * Math.PI * 2;
        this.shimmerSpeed = 0.025 + Math.random() * 0.03;
        this.floatAmp = 0.25 + Math.random() * 0.35;

        this.size = 0.8 + Math.random() * 0.65;
        this.baseAlpha = 0.8 + Math.random() * 0.2;

        const hue = 326 + Math.random() * 26;
        const sat = 72 + Math.random() * 24;
        const light = 72 + Math.random() * 24;
        this.hue = hue;
        this.sat = sat;
        this.light = light;
      }

      update() {
        this.shimmerPhase += this.shimmerSpeed;

        const targetX = this.homeX + Math.sin(this.shimmerPhase) * this.floatAmp;
        const targetY = this.homeY + Math.cos(this.shimmerPhase * 0.9) * this.floatAmp;
        const targetZ = this.homeZ + Math.sin(this.shimmerPhase * 0.7) * (this.floatAmp * 0.6);

        this.x += (targetX - this.x) * 0.12;
        this.y += (targetY - this.y) * 0.12;
        this.z += (targetZ - this.z) * 0.12;
      }

      draw(ctx) {
        const proj = project3D(this.x, this.y, this.z);
        if (proj.scale <= 0) return;

        const twinkle = 0.8 + 0.2 * Math.sin(this.shimmerPhase * 1.4);
        const alpha = Math.min(1, this.baseAlpha * twinkle);
        const drawSize = Math.max(0.65, this.size * proj.scale);

        ctx.fillStyle = `hsla(${this.hue}, ${this.sat}%, ${this.light}%, ${alpha.toFixed(3)})`;
        ctx.fillRect(proj.x, proj.y, drawSize, drawSize);
      }
    }

    function buildTextParticles() {
      textParticles = [];

      const offCanvas = document.createElement("canvas");
      const offCtx = offCanvas.getContext("2d");

      const fontSize = Math.max(22, Math.min(44, Math.floor(width * 0.031)));
      const fontSpec = `600 ${fontSize}px "Segoe UI", Roboto, Arial, sans-serif`;

      offCtx.font = fontSpec;
      const metrics = offCtx.measureText(PARTICLE_TEXT);
      const padX = 24;
      const padY = 24;

      const textWidth = Math.ceil(metrics.width) + padX * 2;
      const textHeight = Math.ceil(fontSize * 1.6) + padY * 2;

      offCanvas.width = textWidth;
      offCanvas.height = textHeight;

      offCtx.font = fontSpec;
      offCtx.fillStyle = "#ffffff";
      offCtx.textAlign = "center";
      offCtx.textBaseline = "middle";
      offCtx.fillText(PARTICLE_TEXT, textWidth / 2, textHeight / 2);

      const imageData = offCtx.getImageData(0, 0, textWidth, textHeight).data;

      const step = 3;
      // Đặt dòng chữ nằm phía trên đỉnh cao nhất của trái tim (đỉnh tim ở khoảng -12.2 * baseScale)
      const offsetYAboveHeart = -15.5 * baseScale;

      for (let y = 0; y < textHeight; y += step) {
        for (let x = 0; x < textWidth; x += step) {
          const idx = (y * textWidth + x) * 4;
          const alpha = imageData[idx + 3];

          if (alpha > 135) {
            const localX = x - textWidth / 2;
            const localY = y - textHeight / 2 + offsetYAboveHeart;
            const localZ = (Math.random() - 0.5) * 2;

            textParticles.push(new TextParticle3D(localX, localY, localZ));
          }
        }
      }
    }

    function emitAt3D(t, count = 45) {
      for (let i = 0; i < count; i++) {
        const jitterT = t - Math.random() * 0.03;
        particles.push(new FlowingParticle3D(jitterT));
      }
    }

    function drawHeadGlow3D(t) {
      const pt = getHeartPoint3D(t);
      const proj = project3D(pt.x, pt.y, pt.z);
      if (proj.scale <= 0) return;

      const radius = 22 * proj.scale;
      const grad = ctx.createRadialGradient(proj.x, proj.y, 0, proj.x, proj.y, radius);
      grad.addColorStop(0, "rgba(255, 235, 245, 0.95)");
      grad.addColorStop(0.45, "rgba(255, 110, 185, 0.45)");
      grad.addColorStop(1, "rgba(255, 110, 185, 0)");

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, 2.5 * proj.scale, 0, Math.PI * 2);
      ctx.fill();
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      cx = width / 2;
      // Hạ tâm trái tim xuống nhẹ một chút để chữ phía trên và trái tim cân đối giữa màn hình
      cy = height / 2 + Math.min(width, height) * 0.06;
      baseScale = Math.min(width, height) * 0.0175;

      initBackgroundElements();
      buildTextParticles();
    }

    window.addEventListener("resize", resize);
    resize();

    function animate() {
      ctx.clearRect(0, 0, width, height);

      drawBackground();

      if (!isDragging) {
        rotY += velY;
        rotX += velX;
        velY *= 0.94;
        velX *= 0.94;
      }

      if (!isDrawingDone) {
        emitAt3D(emitterT, 45);
        drawHeadGlow3D(emitterT);
        emitterT += emitterSpeed;
        if (emitterT >= Math.PI * 2) {
          isDrawingDone = true;
        }
      }

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
      }

      for (let i = 0; i < textParticles.length; i++) {
        const tp = textParticles[i];
        tp.update();
        tp.draw(ctx);
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
